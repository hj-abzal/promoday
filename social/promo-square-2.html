<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
        --ink:#0f2b22;
        --ink-2:#173f31;
        --lime:#a6f542;
        --lime-deep:#5fae1e;
        --cream:#fbfbf4;
        --paper:#ffffff;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    body{
        font-family:"Manrope",sans-serif;
        background:linear-gradient(150deg,var(--lime) 0%,var(--lime-deep) 100%);
        color:var(--ink);
        position:relative;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        padding:72px 76px 64px;
        overflow:hidden;
    }
    body::before{
        content:"";
        position:absolute;
        left:-120px;bottom:-140px;
        width:520px;height:520px;
        border-radius:50%;
        background:rgba(255,255,255,.16);
    }

    .ribbon{
        position:absolute;
        top:56px; right:-92px;
        background:var(--ink);
        color:#fff;
        font-size:24px;
        font-weight:800;
        letter-spacing:.04em;
        padding:16px 110px;
        transform:rotate(38deg);
        box-shadow:0 10px 24px rgba(15,43,34,.28);
    }

    .logo{font-family:"Fraunces",serif;font-size:30px;font-weight:700;letter-spacing:-.01em;position:relative;z-index:1}

    .mid{position:relative;z-index:1}

    .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;opacity:.65}
    .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink)}

    h1{
        font-family:"Fraunces",serif;
        font-weight:700;
        font-size:56px;
        line-height:1.12;
        letter-spacing:-.025em;
        margin-top:24px;
        max-width:820px;
    }

    .gift-row{
        margin-top:40px;
        display:flex;
        gap:16px;
        flex-wrap:wrap;
    }
    .gift-tile{
        background:var(--paper);
        border-radius:16px;
        padding:20px 26px;
        box-shadow:0 10px 26px rgba(15,43,34,.14);
        min-width:220px;
    }
    .gift-tile .was{font-size:16px;font-weight:700;opacity:.35;text-decoration:line-through;display:block;margin-bottom:4px}
    .gift-tile .name{font-size:23px;font-weight:800}
    .gift-tile .free{display:inline-block;margin-top:6px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--lime-deep);background:rgba(95,174,30,.14);border-radius:999px;padding:5px 12px}

    .footer{
        position:relative; z-index:1;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:20px;
        flex-wrap:wrap;
    }
    .total{
        display:inline-flex;
        align-items:center;
        gap:12px;
        background:var(--ink);
        color:#fff;
        padding:20px 32px;
        border-radius:999px;
        font-size:30px;
        font-weight:700;
        box-shadow:0 14px 30px rgba(15,43,34,.28);
    }
    .total u{font-weight:800;color:var(--lime);text-decoration-thickness:2px;text-underline-offset:4px}
    .deadline{font-size:19px;font-weight:700;opacity:.7;margin-top:14px}
    .deadline b{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
    <div class="ribbon">АКЦИЯ АВГУСТА</div>
    <div class="logo">promo<span style="color:var(--ink);opacity:.5">/</span>day</div>

    <div class="mid">
        <div class="eyebrow">только при подключении в августе</div>
        <h1>CRM, аналитика лидов и хостинг — в подарок</h1>
        <div class="gift-row">
            <div class="gift-tile">
                <span class="was">500 000 ₸</span>
                <div class="name">CRM</div>
                <span class="free">Бесплатно</span>
            </div>
            <div class="gift-tile">
                <span class="was">200 000 ₸</span>
                <div class="name">Аналитика лидов</div>
                <span class="free">Бесплатно</span>
            </div>
            <div class="gift-tile">
                <span class="was">7 000 ₸</span>
                <div class="name">Хостинг</div>
                <span class="free">Бесплатно</span>
            </div>
        </div>
    </div>

    <div class="footer">
        <div>
            <div class="total">Экономия — <u>более 700 000 ₸</u></div>
            <div class="deadline">Акция до 31 августа — осталось <b>16 дней</b></div>
        </div>
    </div>
</body>
</html>
